# Configuración de nginx para servir el frontend (base para el Dockerfile de TES-66).
# Copiar este archivo y security-headers.conf a /etc/nginx/conf.d/ (el include de abajo asume esa ruta).
# Nota: no se probó contra una instancia real de nginx; validar con `nginx -t` al armar la imagen.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # `add_header` en un `location` reemplaza al del `server`: por eso se incluye el archivo en cada uno.
  include /etc/nginx/conf.d/security-headers.conf;

  # Archivos con hash en el nombre (main-XXXX.js, styles-XXXX.css): cache larga.
  location ~* \.(?:js|css|woff2?|ico|svg|png|jpg|jpeg|webp)$ {
    include /etc/nginx/conf.d/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # El HTML nunca se cachea: así un despliegue nuevo se toma enseguida.
  location = /index.html {
    include /etc/nginx/conf.d/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  # Aplicación de una sola página: cualquier ruta del router vuelve a index.html.
  location / {
    include /etc/nginx/conf.d/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
