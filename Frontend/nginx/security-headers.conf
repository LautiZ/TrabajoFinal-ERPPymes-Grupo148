# Cabeceras de seguridad del frontend (TES-70).
# Se incluyen desde default.conf. Si cambia la URL del API Gateway, actualizar `connect-src`
# acá y en la <meta> Content-Security-Policy de src/index.html.
#
# Si más adelante se embebe el Brick/SDK de Mercado Pago (hoy el pago es una redirección),
# habría que sumar sus orígenes: script-src https://sdk.mercadopago.com,
# connect-src https://api.mercadopago.com y frame-src https://*.mercadopago.com.ar.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://localhost:3000; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Redundante con frame-ancestors, para navegadores antiguos.
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
