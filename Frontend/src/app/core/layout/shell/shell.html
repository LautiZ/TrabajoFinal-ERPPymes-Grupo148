<div class="shell">
  <aside class="sidebar" [class.sidebar--open]="navOpen()" aria-label="Navegación principal">
    <a class="brand" routerLink="/dashboard" (click)="closeNav()">
      <span class="brand__mark" aria-hidden="true">
        <mat-icon fontSet="material-symbols-outlined">hub</mat-icon>
      </span>
      <span class="brand__text">
        <strong>ERP Pymes</strong>
        <span class="app-eyebrow">Gestión integral</span>
      </span>
    </a>

    <nav class="nav">
      <p class="app-eyebrow nav__title">Módulos principales</p>
      <ul>
        @for (item of modules(); track item.path) {
        <li>
          <a
            class="nav__link"
            [routerLink]="item.path"
            routerLinkActive="nav__link--active"
            ariaCurrentWhenActive="page"
            (click)="closeNav()"
          >
            <mat-icon fontSet="material-symbols-outlined" aria-hidden="true"
              >{{ item.icon }}</mat-icon
            >
            <span>{{ item.label }}</span>
          </a>
        </li>
        }
      </ul>
    </nav>
  </aside>

  @if (navOpen()) {
  <button type="button" class="backdrop" aria-label="Cerrar menú" (click)="closeNav()"></button>
  }

  <div class="main">
    <header class="topbar">
      <button
        mat-icon-button
        type="button"
        class="topbar__menu"
        aria-label="Abrir menú"
        [attr.aria-expanded]="navOpen()"
        (click)="toggleNav()"
      >
        <mat-icon fontSet="material-symbols-outlined">menu</mat-icon>
      </button>

      <label class="search">
        <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">search</mat-icon>
        <input
          type="search"
          placeholder="Buscar productos, SKU u órdenes… (próximamente)"
          aria-label="Búsqueda global"
          disabled
        />
      </label>

      <a mat-flat-button class="topbar__new" routerLink="/sales">
        <mat-icon fontSet="material-symbols-outlined">add</mat-icon>
        Nuevo
      </a>

      <div class="user">
        <span class="user__avatar" aria-hidden="true">{{ initials() }}</span>
        <span class="user__text" [attr.title]="user()?.email">
          <strong>{{ user()?.name }}</strong>
          <span class="app-eyebrow">{{ roleLabel() }}</span>
        </span>
        <button
          mat-icon-button
          type="button"
          class="user__logout"
          aria-label="Cerrar sesión"
          [disabled]="loggingOut()"
          (click)="logout()"
        >
          <mat-icon fontSet="material-symbols-outlined">logout</mat-icon>
        </button>
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
