<section class="analytics-container">

  <header class="analytics-header">
    <div class="analytics-header__titles">
      <h1 class="analytics-header__title">Analítica Financiera</h1>
      <p class="analytics-header__subtitle">
        Resumen de ingresos, ventas, evolución e inventario
      </p>
    </div>

    <div class="analytics-header__filter" data-testid="date-range-filter-slot">
      
    </div>
  </header>


  <section class="analytics-kpi-grid" aria-label="Indicadores clave" data-testid="kpi-cards-slot">
    <div class="kpi-placeholder">Ingresos</div>
    <div class="kpi-placeholder">Cantidad de ventas</div>
    <div class="kpi-placeholder">Ticket promedio</div>
    <div class="kpi-placeholder">Unidades vendidas</div>
    <div class="kpi-placeholder">Valorización de inventario</div>
    <div class="kpi-placeholder">Stock bajo</div>
  </section>


  <section class="analytics-charts-grid" aria-label="Gráficos de evolución y productos" data-testid="charts-slot">
    <div class="chart-card-placeholder">
      Evolución de ingresos y ventas
    </div>
    <div class="chart-card-placeholder">
      Top productos más vendidos
    </div>
  </section>
</section>
