<app-page-header
  eyebrow="Ventas & Pagos"
  title="Punto de venta"
  subtitle="Buscá productos y armá la venta en pocos pasos."
/>

<section class="pos">
  <div class="pos__catalog app-card">
    <mat-form-field appearance="outline" class="pos__search" subscriptSizing="dynamic">
      <mat-label>Buscar por nombre o SKU</mat-label>
      <mat-icon matPrefix fontSet="material-symbols-outlined">search</mat-icon>
      <input
        #searchInput
        matInput
        type="search"
        autocomplete="off"
        [formControl]="search"
        (keydown.enter)="onEnter($event)"
      />
    </mat-form-field>

    @if (loading()) {
    <app-loading-spinner message="Buscando productos..." />
    } @else if (error(); as message) {
    <div class="pos__state" role="alert">
      <p>{{ message }}</p>
      <button mat-stroked-button type="button" (click)="retry()">Reintentar</button>
    </div>
    } @else if (products().length === 0) {
    <p class="pos__state">No hay productos que coincidan con la búsqueda.</p>
    } @else {
    <ul class="pos__grid">
      @for (product of products(); track product.id) {
      <li>
        <button
          type="button"
          class="product"
          [disabled]="!canAdd(product)"
          [attr.aria-label]="'Agregar ' + product.name + ' al carrito'"
          (click)="add(product)"
        >
          <span class="product__name">{{ product.name }}</span>
          <span class="product__sku">{{ product.sku }}</span>
          <span class="product__price"
            >{{ product.price | currency: 'ARS' : 'symbol-narrow' }}</span
          >
          <span class="product__stock" [class.product__stock--empty]="remaining(product) <= 0">
            @if (remaining(product) > 0) { Stock: {{ remaining(product) }} {{
            unitLabels[product.unit] }} } @else { Sin stock }
          </span>
        </button>
      </li>
      }
    </ul>
    }
  </div>

  <aside class="pos__cart">
    <app-cart-view (browse)="focusSearch()" />
  </aside>
</section>
