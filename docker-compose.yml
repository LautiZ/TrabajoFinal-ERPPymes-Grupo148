services:
  postgres: # nombre del servicio = hostname dentro de la red de Docker
    image: postgres:18.6 # version pineada, nunca "latest"
    container_name: erp-pymes-postgres
    restart: unless-stopped
    env_file: .env # carga POSTGRES_USER / PASSWORD / DB
    environment:
      # ":?" corta el arranque de todo el compose si la variable falta o esta vacia en el .env de la raiz
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports:
      - "127.0.0.1:5432:5432" # solo para desarrollo (Prisma desde Windows)
    volumes:
      - pgdata:/var/lib/postgresql # Postgres 18+: este path, NO .../data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate: # one-shot: applies migrations and exits (no restart policy on purpose)
    build:
      context: ./Backend
      target: migrate
    image: erp-pymes-migrate
    container_name: erp-pymes-migrate
    environment:
      AUTH_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=auth
      ERP_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=erp
      PAYMENTS_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=payments
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy

  auth:
    build:
      context: ./Backend
      args:
        APP: auth
    image: erp-pymes-auth
    container_name: erp-pymes-auth
    restart: unless-stopped
    env_file: ./Backend/apps/auth/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=auth
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  erp:
    build:
      context: ./Backend
      args:
        APP: erp
    image: erp-pymes-erp
    container_name: erp-pymes-erp
    restart: unless-stopped
    env_file: ./Backend/apps/erp/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=erp
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  payments:
    build:
      context: ./Backend
      args:
        APP: payments
    image: erp-pymes-payments
    container_name: erp-pymes-payments
    restart: unless-stopped
    env_file: ./Backend/apps/payments/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=payments
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  gateway:
    build:
      context: ./Backend
      args:
        APP: gateway
        USES_PRISMA: "false"
    image: erp-pymes-gateway
    container_name: erp-pymes-gateway
    restart: unless-stopped
    env_file: ./Backend/apps/gateway/.env
    environment:
      AUTH_MS_HOST: auth
      ERP_MS_HOST: erp
      PAYMENTS_MS_HOST: payments
      # detras del nginx del frontend: toma la IP real del cliente para el rate limit del login
      TRUST_PROXY_HOPS: 1
      # solo para ng serve; desde Docker el frontend usa el mismo origen (proxy /api), sin CORS
      CORS_ORIGINS: http://localhost:4200
    ports:
      # solo desde esta maquina (Swagger y ng serve): desde afuera se entra por el frontend.
      # Publicarlo en todas las interfaces permitiria falsear X-Forwarded-For y saltear el rate limit
      - "127.0.0.1:3000:3000"
    networks:
      - backend
    depends_on:
      - auth
      - erp
      - payments

  frontend:
    build:
      context: ./Frontend
    image: erp-pymes-frontend
    container_name: erp-pymes-frontend
    restart: unless-stopped
    environment:
      GATEWAY_URL: http://gateway:3000 # nginx reenvia /api al Gateway por la red privada
    ports:
      - "8080:80" # punto de entrada de la aplicacion
    networks:
      - backend
    depends_on:
      - gateway

networks:
  backend: # red privada del sistema

volumes:
  pgdata:
